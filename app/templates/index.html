<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliHire-AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 20px 0 8px;
            color: #334155;
        }

        input[type="file"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .note {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
        }

        .info {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 12px 15px;
            margin-bottom: 25px;
            color: #334155;
            font-size: 14px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>IntelliHire-AI</h1>

    <p class="subtitle">
        AI-Powered Resume Screening & ATS Analysis
    </p>

    <div class="info">
        Upload a resume and paste the Job Description for the specific role
        you want to apply for. The ATS score will be calculated based on that
        Job Description.
    </div>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <label for="resume">
            Upload Resume
        </label>

        <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf,.docx"
            required
        >

        <p class="note">
            Supported formats: PDF and DOCX
        </p>

        <label for="job_description">
            Job Description
        </label>

        <textarea
            id="job_description"
            name="job_description"
            placeholder="Paste the complete job description for the job you are applying for..."
            required
        ></textarea>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

</body>
</html>
